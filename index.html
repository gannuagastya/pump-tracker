<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pump Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
            background: white;
            color: #1e293b;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 120px;
        }

        .auth-screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .auth-card {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
        }

        .auth-card h1 {
            font-size: 24px;
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 8px;
        }

        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="range"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #0f172a;
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: #1e293b;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #0f172a;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .toggle-auth {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #64748b;
        }

        .toggle-auth button {
            background: none;
            border: none;
            color: #0f172a;
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
        }

        .tab-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: #f1f5f9;
            border-radius: 8px;
            padding: 8px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: #475569;
            font-size: 14px;
        }

        .tab-btn.active {
            background: #0f172a;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .logout-btn {
            float: right;
            background: #e2e8f0;
            color: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 16px;
        }

        .alert-box {
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            border: 2px solid #cbd5e1;
            background: #f1f5f9;
        }

        .alert-box.urgent {
            border-color: #fca5a5;
            background: #fef2f2;
        }

        .alert-label {
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
        }

        .alert-box.urgent .alert-label {
            color: #b91c1c;
        }

        .time-display {
            font-size: 32px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .alert-box.urgent .time-display {
            color: #dc2626;
        }

        .countdown {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
        }

        .alert-box.urgent .countdown {
            color: #b91c1c;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: #64748b;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn-full {
            width: 100%;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .log-form {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .session-list {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
        }

        .session-header {
            background: #e2e8f0;
            padding: 12px 16px;
            border-bottom: 1px solid #cbd5e1;
            font-weight: 600;
            font-size: 14px;
        }

        .session-item {
            padding: 16px;
            border-bottom: 1px solid #cbd5e1;
        }

        .session-item:hover {
            background: #e2e8f0;
        }

        .session-item:last-child {
            border-bottom: none;
        }

        .session-title {
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .session-time {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 8px;
        }

        .session-pain {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
        }

        .delete-btn {
            float: right;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
        }

        .delete-btn:hover {
            color: #0f172a;
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            padding: 24px;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 24px;
            color: #64748b;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #0f172a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="authScreen" class="auth-screen" style="display: none;">
        <div class="auth-card">
            <h1 id="authTitle">Sign Up</h1>
            <div id="errorMsg" class="error-msg" style="display: none;"></div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="authEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="authPassword" placeholder="at least 6 characters">
            </div>
            <button class="btn-primary btn-full" onclick="handleAuth()">Sign Up</button>
            <div class="toggle-auth">
                Already have an account? <button onclick="toggleAuthMode()">Sign In</button>
            </div>
        </div>
    </div>

    <div id="appScreen" style="display: none;">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <div></div>
                <button class="logout-btn" onclick="handleLogout()">Logout</button>
            </div>

            <div class="tab-nav">
                <button class="tab-btn active" onclick="setTab('home')">Home</button>
                <button class="tab-btn" onclick="setTab('analytics')">Analytics</button>
            </div>

            <div id="homeTab" class="tab-content active">
                <h1>Pump Tracker</h1>
                <p class="subtitle" id="affirmation">You're doing amazing.</p>

                <div id="nextPumpAlert" class="alert-box">
                    <div class="alert-label">Next session</div>
                    <div class="time-display" id="nextPumpTime">--:--</div>
                    <div class="countdown" id="timeUntilNext">Loading...</div>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-value" id="pumpCount">0</div>
                        <div class="stat-label">Pumps</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="feedCount">0</div>
                        <div class="stat-label">Feeds</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="totalOz">0</div>
                        <div class="stat-label">oz today</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="waterCount">0</div>
                        <div class="stat-label">Waters</div>
                    </div>
                </div>

                <div class="button-grid">
                    <button class="btn-primary" onclick="startLogForm('pump')">+ Pump</button>
                    <button class="btn-primary" onclick="startLogForm('breastfeed')">+ Feed</button>
                </div>

                <button class="btn-primary btn-full" onclick="addWater()">💧 Water</button>

                <div id="logFormContainer" style="display: none;">
                    <div class="log-form">
                        <h2 style="margin-bottom: 16px; font-size: 16px;" id="formTitle">Log Pumping</h2>
                        
                        <div class="button-grid" style="margin-bottom: 16px;">
                            <button class="btn-primary" onclick="setFormType('pump')">Pump</button>
                            <button class="btn-secondary" onclick="setFormType('breastfeed')">Feed</button>
                        </div>
                        
                        <div id="pumpFormFields" style="display: none;">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Left (oz)</label>
                                    <input type="number" step="0.1" id="leftAmount" placeholder="0">
                                </div>
                                <div class="form-group">
                                    <label>Right (oz)</label>
                                    <input type="number" step="0.1" id="rightAmount" placeholder="0">
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Left (min)</label>
                                    <input type="number" id="leftDuration" value="10">
                                </div>
                                <div class="form-group">
                                    <label>Right (min)</label>
                                    <input type="number" id="rightDuration" value="10">
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Pain (0-10)</label>
                                <input type="range" min="0" max="10" id="painLevel" value="0">
                                <div style="text-align: center; font-size: 12px; color: #64748b; margin-top: 4px;" id="painDisplay">0/10</div>
                            </div>
                        </div>

                        <div id="breastfeedFormFields" style="display: none;">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Left (min)</label>
                                    <input type="number" id="leftFeedDuration" placeholder="0">
                                </div>
                                <div class="form-group">
                                    <label>Right (min)</label>
                                    <input type="number" id="rightFeedDuration" placeholder="0">
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Notes</label>
                            <textarea id="notes" placeholder="Any notes?"></textarea>
                        </div>

                        <button class="btn-primary btn-full" onclick="logSession()" style="margin-bottom: 8px;">Save</button>
                        <button class="btn-secondary btn-full" onclick="cancelLogForm()">Cancel</button>
                    </div>
                </div>

                <div class="session-list">
                    <div class="session-header">Recent Sessions</div>
                    <div id="sessionsList">
                        <div class="loading"><div class="spinner"></div></div>
                    </div>
                </div>
            </div>

            <div id="analyticsTab" class="tab-content">
                <h1>Analytics</h1>
                <p class="subtitle">Last 7 days</p>

                <div class="session-list">
                    <div class="session-header">Supply Trend</div>
                    <div id="analyticsList">
                        <div class="loading"><div class="spinner"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyBbEiogvrrO4Oxt0pt4EEEfTVGnmNb6f8s",
            authDomain: "pump-tracker-e1041.firebaseapp.com",
            projectId: "pump-tracker-e1041",
            storageBucket: "pump-tracker-e1041.firebasestorage.app",
            messagingSenderId: "713884469970",
            appId: "1:713884469970:web:c7405f3b9706f92d94fb0b"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // State
        let currentUser = null;
        let isSignUp = true;
        let formType = 'pump';
        let currentTab = 'home';

        const affirmations = [
            "You're doing amazing.",
            "Your baby is lucky to have you.",
            "Rest when you can.",
            "One more session. You've got this.",
            "Hydrate and keep going.",
            "You're stronger than this.",
            "This is temporary."
        ];

        const PUMP_INTERVAL = 180; // minutes

        // Auth handlers
        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('authTitle').textContent = isSignUp ? 'Sign Up' : 'Sign In';
            document.querySelector('.toggle-auth').innerHTML = isSignUp 
                ? 'Already have an account? <button onclick="toggleAuthMode()">Sign In</button>'
                : "Don't have an account? <button onclick=\"toggleAuthMode()\">Sign Up</button>";
        }

        function handleAuth() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const errorMsg = document.getElementById('errorMsg');

            if (!email || !password) {
                errorMsg.textContent = 'Please fill in all fields';
                errorMsg.style.display = 'block';
                return;
            }

            if (isSignUp) {
                auth.createUserWithEmailAndPassword(email, password)
                    .then(user => {
                        console.log('Signed up:', user.user.email);
                        showApp();
                    })
                    .catch(error => {
                        errorMsg.textContent = error.message;
                        errorMsg.style.display = 'block';
                    });
            } else {
                auth.signInWithEmailAndPassword(email, password)
                    .then(user => {
                        console.log('Signed in:', user.user.email);
                        showApp();
                    })
                    .catch(error => {
                        errorMsg.textContent = error.message;
                        errorMsg.style.display = 'block';
                    });
            }
        }

        function handleLogout() {
            auth.signOut().then(() => {
                currentUser = null;
                showAuth();
            });
        }

        // UI handlers
        function showAuth() {
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('appScreen').style.display = 'none';
        }

        function showApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
            loadData();
            setInterval(updateNextPump, 1000);
            setInterval(() => {
                document.getElementById('affirmation').textContent = affirmations[Math.floor(Math.random() * affirmations.length)];
            }, 1800000);
        }

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
            document.querySelector(`[onclick="setTab('${tab}')"]`).classList.add('active');

            if (tab === 'analytics') {
                loadAnalytics();
            }
        }

        function startLogForm(type) {
            formType = type;
            setFormType(type);
            document.getElementById('logFormContainer').style.display = 'block';
        }

        function setFormType(type) {
            formType = type;
            document.getElementById('formTitle').textContent = type === 'pump' ? 'Log Pumping' : 'Log Breastfeeding';
            document.getElementById('pumpFormFields').style.display = type === 'pump' ? 'block' : 'none';
            document.getElementById('breastfeedFormFields').style.display = type === 'breastfeed' ? 'block' : 'none';
        }

        function cancelLogForm() {
            document.getElementById('logFormContainer').style.display = 'none';
            document.getElementById('leftAmount').value = '';
            document.getElementById('rightAmount').value = '';
            document.getElementById('leftFeedDuration').value = '';
            document.getElementById('rightFeedDuration').value = '';
            document.getElementById('notes').value = '';
            document.getElementById('painLevel').value = '0';
        }

        // Firebase operations
        function logSession() {
            if (!currentUser) return;

            if (formType === 'pump') {
                const left = parseFloat(document.getElementById('leftAmount').value) || 0;
                const right = parseFloat(document.getElementById('rightAmount').value) || 0;
                if (left === 0 && right === 0) {
                    alert('Enter amount for at least one side');
                    return;
                }
            }

            const session = {
                type: formType,
                timestamp: new Date().toISOString(),
                leftAmount: parseFloat(document.getElementById('leftAmount').value) || 0,
                rightAmount: parseFloat(document.getElementById('rightAmount').value) || 0,
                leftDuration: parseInt(document.getElementById('leftDuration').value) || 0,
                rightDuration: parseInt(document.getElementById('rightDuration').value) || 0,
                leftFeedDuration: parseInt(document.getElementById('leftFeedDuration').value) || 0,
                rightFeedDuration: parseInt(document.getElementById('rightFeedDuration').value) || 0,
                notes: document.getElementById('notes').value,
                painLevel: parseInt(document.getElementById('painLevel').value) || 0
            };

            db.collection('users').doc(currentUser.uid).collection('sessions').add(session)
                .then(() => {
                    cancelLogForm();
                    loadData();
                })
                .catch(error => alert('Error saving: ' + error.message));
        }

        function deleteSession(id) {
            if (!currentUser) return;
            db.collection('users').doc(currentUser.uid).collection('sessions').doc(id).delete()
                .then(() => loadData())
                .catch(error => alert('Error deleting: ' + error.message));
        }

        function addWater() {
            if (!currentUser) return;
            const today = new Date().toDateString();
            db.collection('users').doc(currentUser.uid).collection('daily').doc(today).update({
                water: firebase.firestore.FieldValue.increment(1)
            }).catch(() => {
                db.collection('users').doc(currentUser.uid).collection('daily').doc(today).set({
                    water: 1
                });
            });
            setTimeout(loadData, 500);
        }

        function loadData() {
            if (!currentUser) return;

            const today = new Date().toDateString();
            let pumpCount = 0;
            let feedCount = 0;
            let totalOz = 0;
            let waterCount = 0;
            let nextPumpTime = new Date();

            // Get sessions
            db.collection('users').doc(currentUser.uid).collection('sessions')
                .where('timestamp', '>=', new Date(new Date().setHours(0, 0, 0, 0)).toISOString())
                .orderBy('timestamp', 'desc')
                .onSnapshot(snapshot => {
                    let html = '';
                    let lastPump = null;
                    pumpCount = 0;
                    feedCount = 0;
                    totalOz = 0;

                    snapshot.forEach(doc => {
                        const session = doc.data();
                        if (new Date(session.timestamp).toDateString() === today) {
                            if (session.type === 'pump') {
                                pumpCount++;
                                totalOz += (session.leftAmount || 0) + (session.rightAmount || 0);
                                if (!lastPump) lastPump = new Date(session.timestamp);
                            } else {
                                feedCount++;
                            }
                        }

                        const date = new Date(session.timestamp);
                        html += `
                            <div class="session-item">
                                <button class="delete-btn" onclick="deleteSession('${doc.id}')">✕</button>
                                <div class="session-title">
                                    ${session.type === 'pump' 
                                        ? `L ${session.leftAmount}oz • R ${session.rightAmount}oz`
                                        : `L ${session.leftFeedDuration}min • R ${session.rightFeedDuration}min`}
                                </div>
                                <div class="session-time">${date.toLocaleDateString()} at ${date.toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'})}</div>
                                ${session.painLevel > 0 ? `<div class="session-pain">Pain: ${session.painLevel}/10</div>` : ''}
                                ${session.notes ? `<div style="font-size: 12px; color: #0f172a; background: white; border: 1px solid #cbd5e1; border-radius: 4px; padding: 8px; margin-top: 8px; font-style: italic;">${session.notes}</div>` : ''}
                            </div>
                        `;
                    });

                    document.getElementById('pumpCount').textContent = pumpCount;
                    document.getElementById('feedCount').textContent = feedCount;
                    document.getElementById('totalOz').textContent = totalOz.toFixed(1);
                    document.getElementById('sessionsList').innerHTML = html || '<div class="empty-state">No sessions yet</div>';

                    if (lastPump) {
                        nextPumpTime = new Date(lastPump.getTime() + 180 * 60000);
                        updateNextPump();
                    }
                });

            // Get water count
            db.collection('users').doc(currentUser.uid).collection('daily').doc(today).onSnapshot(doc => {
                waterCount = doc.exists ? (doc.data().water || 0) : 0;
                document.getElementById('waterCount').textContent = waterCount;
            });
        }

        function updateNextPump() {
            if (!currentUser) return;
            const today = new Date().toDateString();

            db.collection('users').doc(currentUser.uid).collection('sessions')
                .where('type', '==', 'pump')
                .orderBy('timestamp', 'desc')
                .limit(1)
                .onSnapshot(snapshot => {
                    let nextTime = new Date();
                    if (!snapshot.empty) {
                        const lastPump = snapshot.docs[0].data();
                        nextTime = new Date(new Date(lastPump.timestamp).getTime() + 180 * 60000);
                    }

                    const now = new Date();
                    const isOverdue = nextTime < now;
                    const alert = document.getElementById('nextPumpAlert');
                    alert.classList.toggle('urgent', isOverdue);
                    alert.querySelector('.alert-label').textContent = isOverdue ? 'Time to pump now' : 'Next session';
                    document.getElementById('nextPumpTime').textContent = nextTime.toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});

                    const diff = nextTime - now;
                    if (diff < 0) {
                        document.getElementById('timeUntilNext').textContent = 'Time now';
                    } else {
                        const hours = Math.floor(diff / 3600000);
                        const minutes = Math.floor((diff % 3600000) / 60000);
                        document.getElementById('timeUntilNext').textContent = hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
                    }
                });
        }

        function loadAnalytics() {
            if (!currentUser) return;

            db.collection('users').doc(currentUser.uid).collection('sessions')
                .where('type', '==', 'pump')
                .orderBy('timestamp', 'desc')
                .onSnapshot(snapshot => {
                    const dataByDate = {};
                    snapshot.forEach(doc => {
                        const date = new Date(doc.data().timestamp).toLocaleDateString('en-US', {month: 'short', day:'numeric'});
                        if (!dataByDate[date]) dataByDate[date] = 0;
                        dataByDate[date] += (doc.data().leftAmount || 0) + (doc.data().rightAmount || 0);
                    });

                    let html = '';
                    Object.entries(dataByDate).reverse().slice(0, 7).forEach(([date, total]) => {
                        html += `
                            <div class="session-item">
                                <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
                                    <span style="width: 40px; font-weight: 600;">${date}</span>
                                    <div style="flex: 1; height: 24px; background: #cbd5e1; border-radius: 4px; overflow: hidden;">
                                        <div style="height: 100%; background: #475569; width: ${Math.min(total * 5, 200)}px;"></div>
                                    </div>
                                    <span style="width: 40px; text-align: right; font-weight: 600;">${total} oz</span>
                                </div>
                            </div>
                        `;
                    });

                    document.getElementById('analyticsList').innerHTML = html || '<div class="empty-state">No data yet</div>';
                });
        }

        // Initialize
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                showApp();
            } else {
                currentUser = null;
                showAuth();
            }
        });

        // Update pain display
        document.addEventListener('DOMContentLoaded', () => {
            const painSlider = document.getElementById('painLevel');
            if (painSlider) {
                painSlider.addEventListener('input', (e) => {
                    document.getElementById('painDisplay').textContent = e.target.value + '/10';
                });
            }
        });
    </script>
</body>
</html>
